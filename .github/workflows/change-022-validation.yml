name: CHANGE-022 validation

on:
  push:
    branches:
      - change/root/CHANGE-022-compiled-semantic-context

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Targeted compiled context tests
        run: python _scripts/test_compiled_context.py
      - name: Semantic index regression
        run: python _scripts/test_semantic_index.py
      - name: Publication regression
        run: python _scripts/test_publication.py
      - name: Full script test discovery
        run: python -m unittest discover -s _scripts -p 'test_*.py'
      - name: Compile real MOP domain
        run: python _scripts/compile_semantic_context.py --root . build --scope _applications/mop
      - name: Validate real MOP compiled output
        run: python _scripts/compile_semantic_context.py --root . validate --scope _applications/mop
      - name: Project MOP publication from compiled
        run: python _scripts/compile_semantic_context.py --root . publication --scope _applications/mop --output /tmp/publication-from-compiled.md
      - name: Build MOP publication directly
        run: python _scripts/build_publication.py build --root _applications/mop --spec SEMANTIC_GIT.md
      - name: Compare compiled and direct publication byte-for-byte
        run: cmp /tmp/publication-from-compiled.md _applications/mop/_publications/PUBLICATION.md
