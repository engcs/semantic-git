name: reconcile-change-024

"on":
  push:
    branches:
      - change/root/CHANGE-024-reconstructable-memory
    paths:
      - .github/workflows/change-024-reconcile.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: change/root/CHANGE-024-reconstructable-memory
          fetch-depth: 0
      - name: Validate implementation
        run: |
          git fetch origin main
          test "$(git rev-list --count HEAD..origin/main)" = "0"
          python _scripts/semantic_git.py validate --json
          python -m unittest discover -s _scripts -p 'test_*.py' -v
      - name: Mark reconciled
        env:
          REC_B64: 
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          p = Path('_changes/CHANGE-024.md')
          text = p.read_text(encoding='utf-8')
          if 'status: IN_PROGRESS' not in text:
              raise SystemExit('unexpected CHANGE status')
          text = text.replace('status: IN_PROGRESS', 'status: RECONCILED', 1)
          marker = '\n## Fora de escopo\n'
          rec = base64.b64decode(os.environ['REC_B64']).decode('utf-8')
          if marker not in text:
              raise SystemExit('marker not found')
          text = text.replace(marker, '\n' + rec + '\n## Fora de escopo\n', 1)
          p.write_text(text, encoding='utf-8')
          PY
          python _scripts/semantic_git.py validate --json
      - name: Commit reconciliation
        run: |
          git rm .github/workflows/change-024-reconcile.yml
          git config user.name "Semantic Git Automation"
          git config user.email "actions@users.noreply.github.com"
          git add _changes/CHANGE-024.md
          git commit -m "change: reconcile CHANGE-024"
          git push origin HEAD:change/root/CHANGE-024-reconstructable-memory
