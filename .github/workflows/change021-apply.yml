name: Apply CHANGE-021

on:
  push:
    branches:
      - change/root/CHANGE-021-semantic-index

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply approved normative and validator changes
        run: python _scripts/apply_change021_once.py patch

      - name: Run semantic index unit tests
        run: python _scripts/test_semantic_index.py

      - name: Run existing mathematical deterministic fixtures
        run: python _scripts/validate_mathematical_review_examples.py

      - name: Confirm structural blocker is pre-existing and unchanged
        run: |
          set +e
          python _scripts/validate_structure.py --root . --spec SEMANTIC_GIT.md --json > /tmp/current-structure.json
          current_rc=$?
          git worktree add --detach /tmp/base-tree 463bf8c7c6578417e0eba51cfab98c95af2a8222
          python /tmp/base-tree/_scripts/validate_structure.py --root /tmp/base-tree --spec /tmp/base-tree/SEMANTIC_GIT.md --json > /tmp/base-structure.json
          base_rc=$?
          set -e
          test "$current_rc" -eq 1
          test "$base_rc" -eq 1
          python - <<'PY'
          import json
          from pathlib import Path
          base=json.loads(Path('/tmp/base-structure.json').read_text())
          current=json.loads(Path('/tmp/current-structure.json').read_text())
          def normalized(payload):
              return sorted((f['rule'],f['path'],f['message']) for f in payload['findings'])
          assert normalized(current)==normalized(base), (base,current)
          expected=[
              ('CHANGE_APPROVAL','_changes/archived/CHANGE-016.md','approval_scope must contain at least one path after approval'),
              ('CHANGE_APPROVAL','_changes/archived/CHANGE-016.md','approved_semantic_commit is required after approval'),
          ]
          assert normalized(current)==sorted(expected), current
          print('KNOWN_BASELINE_BLOCKER:', *normalized(current), sep='\n- ')
          PY

      - name: Commit approved implementation that does not depend on the blocker
        run: |
          git add SEMANTIC_GIT.md _scripts/validate_structure.py
          git diff --cached --quiet || git commit -m "feat: integrate scoped semantic index normatively"

      - name: Verify scripts compile
        run: |
          python -m py_compile _scripts/semantic_index.py _scripts/validate_structure.py _scripts/test_semantic_index.py
          python _scripts/test_semantic_index.py

      - name: Push implementation candidate
        run: git push origin HEAD:${GITHUB_REF_NAME}
