name: CHANGE-021 Final Tests

on:
  push:
    branches:
      - change/root/CHANGE-021-semantic-index

permissions:
  contents: read

jobs:
  final-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify candidate identity
        run: |
          test "$(sed -n '1p' _changes/CHANGE-021.md)" = "change: CHANGE-021"
          grep -qx 'status: RECONCILED' _changes/CHANGE-021.md
          test "$(git merge-base origin/main HEAD)" = "$(git rev-parse origin/main)"

      - name: Validate repository structure
        run: python _scripts/validate_structure.py --root . --spec SEMANTIC_GIT.md --json

      - name: Run semantic index tests
        run: python _scripts/test_semantic_index.py

      - name: Validate mathematical review fixtures
        run: python _scripts/validate_mathematical_review_examples.py

      - name: Compile changed Python scripts
        run: python -m py_compile _scripts/semantic_index.py _scripts/test_semantic_index.py _scripts/validate_structure.py _scripts/validate_mathematical_review_examples.py

      - name: Validate materialized root index
        run: python _scripts/semantic_index.py validate --scope .

      - name: Query materialized root index
        run: python _scripts/semantic_index.py query --scope . --id root:CHANGE-021 > /tmp/change021-query.json

      - name: Verify query result
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/change021-query.json', encoding='utf-8'))
          ids=[n['id'] for n in p.get('matches', [])]
          assert ids == ['root:CHANGE-021'], ids
          PY

      - name: Verify archived history is untouched
        run: |
          test -z "$(git diff --name-only origin/main...HEAD -- '_changes/archived/**')"

      - name: Check diff whitespace
        run: git diff --check origin/main...HEAD

      - name: Verify no one-shot implementation scaffolding remains
        run: |
          test ! -e _scripts/apply_change021_once.py
          test ! -e .github/workflows/change021-apply.yml
          test ! -e .github/workflows/change021-finalize.yml
