name: CLI ergonomics validation

on:
  push:
    branches:
      - chore/cli-ergonomics

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Canonical CLI tests
        run: python _scripts/test_semantic_git_cli.py
      - name: Existing regression suite
        run: python -m unittest discover -s _scripts -p 'test_*.py'
      - name: Capability map JSON
        run: python _scripts/semantic_git.py capabilities --json
      - name: Validate repository with auto-detected root
        run: python _scripts/semantic_git.py validate --json
      - name: Build and validate MOP index
        run: |
          python _scripts/semantic_git.py index build --namespace _applications/mop
          python _scripts/semantic_git.py index validate --namespace _applications/mop
      - name: Build and validate MOP compiled context
        run: |
          python _scripts/semantic_git.py compiled build --namespace _applications/mop
          python _scripts/semantic_git.py compiled validate --namespace _applications/mop
      - name: Compare compiled and direct publication
        run: |
          python _scripts/semantic_git.py compiled publication --namespace _applications/mop --output tmp-publication.md
          python _scripts/semantic_git.py publication build --namespace _applications/mop
          cmp tmp-publication.md _applications/mop/_publications/PUBLICATION.md
