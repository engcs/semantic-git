name: Validate CHANGE-016 metadata repair

on:
  push:
    branches:
      - maintenance/root/change-016-approval-metadata

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate repository structure
        run: python _scripts/validate_structure.py --root . --spec SEMANTIC_GIT.md --json

      - name: Confirm repair is metadata-only
        run: |
          git diff --exit-code 463bf8c7c6578417e0eba51cfab98c95af2a8222 -- . ':!_changes/archived/CHANGE-016.md' ':!.github/workflows/validate-change016-repair.yml'
          git diff --unified=0 463bf8c7c6578417e0eba51cfab98c95af2a8222 -- _changes/archived/CHANGE-016.md
