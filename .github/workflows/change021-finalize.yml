name: Finalize CHANGE-021

on:
  push:
    branches:
      - change/root/CHANGE-021-semantic-index

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply archive immutability correction
        run: python _scripts/apply_change021_archive_immutability.py

      - name: Validate corrected structure
        run: python _scripts/validate_structure.py --root . --spec SEMANTIC_GIT.md --json

      - name: Run semantic index tests
        run: python _scripts/test_semantic_index.py

      - name: Run mathematical regression fixtures
        run: python _scripts/validate_mathematical_review_examples.py

      - name: Commit correction
        run: |
          git add SEMANTIC_GIT.md AGENTS.md _scripts/validate_structure.py _scripts/test_semantic_index.py
          git diff --cached --quiet || git commit -m "fix: preserve immutable archived CHANGEs in validation"

      - name: Reconcile CHANGE-021
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('_changes/CHANGE-021.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace('status: IN_PROGRESS', 'status: RECONCILED', 1)
          if '## Validation Evidence' not in text:
              text += '''\n## Validation Evidence\n\n- O validator estrutural passou sem exigir alteração retroativa de CHANGEs arquivadas.\n- CHANGEs arquivadas preservam integralmente seu conteúdo histórico; campos de aprovação modernos ausentes não são fabricados retroativamente.\n- Metadados modernos presentes em arquivos históricos continuam sendo validados quanto à forma.\n- A suíte `test_semantic_index.py` passou com fixture de CHANGE arquivada legada sem `approved_semantic_commit`/`approval_scope`.\n- As fixtures determinísticas de revisão matemática permanecem válidas.\n- O índice de `root` foi materializado, validado e consultado com sucesso.\n\n### Reconciliation Summary\n\n- O índice scoped está implementado em JSON, com `nodes`, `edges`, proveniência, `source_commit`, `source_fingerprint`, stubs externos e comandos `build`, `validate` e `query`.\n- A validação estrutural é pré-condição do índice, mas respeita a imutabilidade histórica: evolução do validator não autoriza reescrita de CHANGE arquivada.\n- O índice de `root` é apenas o maior escopo; índices descendentes permanecem reproduzíveis sob demanda.\n'''
          p.write_text(text, encoding='utf-8')
          PY
          git add _changes/CHANGE-021.md
          git commit -m "change: reconcile CHANGE-021 semantic index"

      - name: Build and validate canonical root index
        run: |
          rm -rf _index
          python _scripts/semantic_index.py build --scope .
          python _scripts/semantic_index.py validate --scope .
          python _scripts/semantic_index.py query --scope . --type change > /tmp/change021-query.json
          test -s /tmp/change021-query.json
          git add _index/SEMANTIC_INDEX.json
          git commit -m "test: materialize validated root semantic index"

      - name: Remove one-shot scaffolding
        run: |
          git rm _scripts/apply_change021_archive_immutability.py .github/workflows/change021-finalize.yml
          git commit -m "chore: remove CHANGE-021 one-shot scaffolding"

      - name: Final verification
        run: |
          python _scripts/validate_structure.py --root . --spec SEMANTIC_GIT.md --json
          python _scripts/test_semantic_index.py
          python _scripts/validate_mathematical_review_examples.py
          python _scripts/semantic_index.py validate --scope .
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          test -z "$(git status --porcelain)"

      - name: Push reconciled candidate
        run: git push origin HEAD:${GITHUB_REF_NAME}
