name: CHANGE-023 implementation

on:
  push:
    branches:
      - change/root/CHANGE-023-memory-rdo-reconciliation

permissions:
  contents: write

jobs:
  implement-and-test:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply approved change
        run: python .github/scripts/apply_change_023.py
      - name: Commit locally
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SEMANTIC_GIT.md .opencode/skills/semantic-memory/SKILL.md _scripts/_internal/validate_structure.py _scripts/_internal/memory_reconciliation.py _scripts/test_memory_reconciliation.py
          git commit -m "feat: reconcile promoted findings with RDO evolution"
      - name: Targeted tests
        run: python -m unittest _scripts.test_memory_reconciliation -v
      - name: Structural validation
        run: python _scripts/semantic_git.py validate --json
      - name: Full tests
        run: python -m unittest discover -s _scripts -p 'test_*.py' -v
      - name: Push tested implementation
        run: git push origin HEAD:change/root/CHANGE-023-memory-rdo-reconciliation
