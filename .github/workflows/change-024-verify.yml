name: CHANGE-024 temporary verification

on:
  push:
    branches:
      - change/root/CHANGE-024-reconstructable-memory
    paths:
      - .github/workflows/change-024-verify.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: change/root/CHANGE-024-reconstructable-memory
          fetch-depth: 0

      - name: Apply final normative consistency fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('SEMANTIC_GIT.md')
          text = p.read_text(encoding='utf-8')
          old = '''93. Requirements registram somente verdades, necessidades e invariantes estáveis do domínio.
          94. Decisions registram escolhas conceituais e não podem conter detalhes de materialização física.
          95. Regras matemáticas em Decisions devem usar conceitos abstratos; sua composição física pertence a Operations.
          96. Operations registram cálculo, transformação e materialização sem criar regra semântica nova.'''
          new = '''93. Requirements registram verdades, necessidades e invariantes estáveis do domínio e podem conter a fórmula humana definidora de um indicador calculável quando ela expressar diretamente o significado do próprio objeto por componentes semânticos.
          94. Decisions registram escolhas conceituais, definem os componentes e convenções necessários à fórmula quando aplicável e não podem conter detalhes de materialização física.
          95. Regras matemáticas complementares em Decisions devem usar conceitos abstratos; a composição física das regras e fórmulas pertence a Operations.
          96. Operations registram cálculo, transformação e materialização sem criar regra semântica nova.'''
          if old not in text:
              raise SystemExit('global R/D/O invariants block not found')
          text = text.replace(old, new, 1)
          text = text.replace('129. Findigs equivalentes evoluem por UPSERT;', '129. Findings equivalentes evoluem por UPSERT;', 1)

          old_ai = '''- localizar e reconciliar findings promovidos quando R/D/O por eles referenciado for materialmente modificado, removido ou substituído, preservando findings não relacionados;
          - verificar integridade referencial mesmo quando não houver promoção de IDs;'''
          new_ai = '''- tratar FINDINGS como capacidade nativa do protocolo e `_memory/FINDINGS.yaml` como conteúdo analítico não autoritativo perante R/D/O;
          - reconciliar nova investigação com FINDINGS por UPSERT, preservando identidade, evidência, aplicabilidade e findings não examinados;
          - representar em FINDINGS o estado atual do conhecimento e usar Git para a evolução histórica, mantendo variantes antigas somente enquanto continuarem materialmente aplicáveis;
          - confrontar R/D/O novo ou editado com FINDINGS aplicáveis, distinguindo sustentação, cobertura parcial, contradição, ausência de sustentação, ambiguidade e evidência desatualizada;
          - orientar reinvestigação por hipótese sem viés confirmatório, buscando evidência favorável, refutadora e interpretações concorrentes;
          - localizar e reconciliar findings promovidos quando R/D/O por eles referenciado for materialmente modificado, removido ou substituído, preservando findings não relacionados;
          - verificar integridade referencial mesmo quando não houver promoção de IDs;'''
          if old_ai not in text:
              raise SystemExit('AI behavior FINDINGS block not found')
          text = text.replace(old_ai, new_ai, 1)

          old_no = '''- usar `_memory` como espelho textual de R/D/O ou reescrever findings não relacionados apenas porque R/D/O mudou;
          - deixar sem reconciliação finding promovido deterministicamente ligado a R/D/O materialmente afetado por um CHANGE;'''
          new_no = '''- usar `_memory` como espelho textual de R/D/O ou reescrever findings não relacionados apenas porque R/D/O mudou;
          - tratar o conteúdo de FINDINGS como autoridade concorrente a R/D/O;
          - embutir genealogia V1…Vn em FINDINGS apenas porque versões históricas existiram;
          - aceitar proposição R/D/O sem evidência como verdadeira apenas porque nenhum finding a contradiz;
          - deixar sem reconciliação finding promovido deterministicamente ligado a R/D/O materialmente afetado por um CHANGE;'''
          if old_no not in text:
              raise SystemExit('AI prohibited FINDINGS block not found')
          text = text.replace(old_no, new_no, 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Canonical Semantic Git validation
        run: python _scripts/semantic_git.py validate --json

      - name: Full Python test suite
        run: python -m unittest discover -s _scripts -p 'test_*.py' -v

      - name: Commit verified implementation and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/change-024-verify.yml
          git config user.name "Semantic Git Automation"
          git config user.email "actions@users.noreply.github.com"
          git add SEMANTIC_GIT.md
          git commit -m "fix: reconcile FINDINGS normative invariants"
          git push origin HEAD:change/root/CHANGE-024-reconstructable-memory
