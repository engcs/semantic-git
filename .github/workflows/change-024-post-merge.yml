name: change-024-post-merge

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/change-024-post-merge.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate merged state
        run: python _scripts/semantic_git.py validate --json

      - name: Archive and mark merged
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('_changes/CHANGE-024.md')
          dst = Path('_changes/archived/CHANGE-024.md')
          if not src.exists():
              raise SystemExit('CHANGE-024 active file not found')
          if dst.exists():
              raise SystemExit('CHANGE-024 already archived')
          text = src.read_text(encoding='utf-8')
          if 'status: RECONCILED' not in text:
              raise SystemExit('CHANGE-024 is not RECONCILED')
          text = text.replace('status: RECONCILED', 'status: MERGED', 1)
          dst.parent.mkdir(parents=True, exist_ok=True)
          dst.write_text(text, encoding='utf-8')
          src.unlink()
          PY
          git rm .github/workflows/change-024-post-merge.yml
          git config user.name "Semantic Git Automation"
          git config user.email "actions@users.noreply.github.com"
          git add _changes/CHANGE-024.md _changes/archived/CHANGE-024.md
          git commit -m "change: archive and mark root:CHANGE-024 merged"
          git push origin main
