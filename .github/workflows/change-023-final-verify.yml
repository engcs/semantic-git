name: CHANGE-023 final verification

on:
  push:
    branches:
      - change/root/CHANGE-023-memory-rdo-reconciliation

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Structural validation
        run: python _scripts/semantic_git.py validate --json
      - name: Targeted tests
        run: python -m unittest _scripts.test_memory_reconciliation -v
      - name: Full tests
        run: python -m unittest discover -s _scripts -p 'test_*.py' -v
